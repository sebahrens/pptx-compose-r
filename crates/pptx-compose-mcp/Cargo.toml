[package]
name = "pptx-compose-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pptx-compose = { path = "../pptx-compose" }
rmcp = { workspace = true, features = ["schemars", "transport-io"] }
schemars.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "=1.52.3", features = ["io-std", "macros", "rt-multi-thread"] }
