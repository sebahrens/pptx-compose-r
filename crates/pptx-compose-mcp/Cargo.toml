[package]
name = "pptx-compose-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pptx-compose-mcp"
path = "src/main.rs"

[dependencies]
clap.workspace = true
pptx-compose = { path = "../pptx-compose" }
rmcp = { workspace = true, features = ["client", "schemars", "transport-io"] }
schemars.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.52.3", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
jsonschema.workspace = true
zip.workspace = true
